- id: larimer-picciani-2026-mta
  bibkey: larimerpicciani2026systemic
  title: Systemic, RPE-directed AAV-tyrosinase therapy restores ocular pigmentation in an OCA1 mouse model
  authors:
    - { short: Larimer-Picciani AM, full: "Larimer-Picciani, Alessandra M." }
    - { short: Jacob LB, full: "Jacob, Lucas B." }
    - { short: Sullinger KJ, full: "Sullinger, Kacey J." }
    - { short: Kriebel WG, full: "Kriebel, Wyatt G.", me: true }
    - { short: Sahel J-A, full: "Sahel, José-Alain" }
    - { short: Byrne LC, full: "Byrne, Leah C." }
  venue: Molecular Therapy Advances
  venue_short: Mol Ther Adv
  volume: 34
  number: 201861
  year: 2026
  kind: Article
  history: Published 7 October 2026
  status: Open access
  doi: 10.1016/j.omta.2026.201861
  preprint: https://doi.org/10.64898/2026.07.01.735814
  summary: >-
    Compares intravenous, subretinal and intravitreal delivery of AAV-tyrosinase
    with ubiquitous and RPE-directed promoters in an OCA1 mouse model. Early
    intravenous delivery of the RPE-directed construct restored widespread
    ocular pigment with lower off-target expression, and treated mice showed
    altered light-avoidance behavior in a pilot study.
  selected: true

