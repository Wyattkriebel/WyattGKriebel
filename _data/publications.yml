  doi: 10.1038/s41598-026-45301-x
  summary: >-
    A battery of behavioral tests for vision in OCA1 mice. The mice avoided
    bright light, showed weaker novel-object recognition and responded
    differently to an overhead looming stimulus, giving measurable readouts
    of the visual deficits that come with albinism.
