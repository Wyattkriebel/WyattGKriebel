in_brief: >-
  I am Wyatt Kriebel, and I work across molecular biology, computation, and
  manufacturing. At the University of Pittsburgh, I spent five years on AAV
  gene therapy for oculocutaneous albinism type 1, purifying vectors and
  building the behavioral assays used to measure vision in OCA1 mice, and
  later simulated de novo-designed enzymes with molecular dynamics. I now work
  in cGMP manufacturing of gene therapies at Krystal Biotech.

interests: >-
  Protein/enzyme engineering; molecular simulation and modeling; clean water
  justice; AAV vector and capsid engineering; computational benchmarking; and
  building biotechnologies to address a wide range of environmental concerns

