  year: 2026
  kind: Preprint
  history: Posted 2 July 2026
  status: Accepted at Molecular Therapy (in press)
  doi: 10.64898/2026.07.01.735814
  summary: >-
    Compares intraocular and systemic AAV delivery, using vectors with
    different degrees of RPE specificity, for restoring iris, RPE and choroid
    pigment in an OCA1 mouse model. Early systemic delivery of an RPE-directed
    AAV-Tyrosinase construct restored ocular pigmentation.
