in_brief: >-
  Wyatt Kriebel works across molecular biology, computation and
  manufacturing. At the University of Pittsburgh he spent five years on AAV
  gene therapy for oculocutaneous albinism type 1, purifying vectors and
  building the behavioral assays used to measure vision in OCA1 mice, and
  later simulated de novo designed enzymes with molecular dynamics. He now
  manufactures gene therapies under cGMP at Krystal Biotech.

interests: >-
  Protein engineering and de novo enzyme design; molecular simulation and
  modeling; AAV vector and capsid engineering; and the path from a designed
  molecule to a manufacturable therapy.

