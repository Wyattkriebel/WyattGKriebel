<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@graph": [
  {%- for pub in site.data.publications %}
    {
      "@type": "ScholarlyArticle",
      "headline": {{ pub.title | jsonify }},
      "name": {{ pub.title | jsonify }},
      "author": [
        {%- for a in pub.authors %}
        { "@type": "Person", "name": {{ a.full | jsonify }} }{% unless forloop.last %},{% endunless %}
        {%- endfor %}
      ],
      "datePublished": "{{ pub.year }}",
      "isPartOf": { "@type": "Periodical", "name": {{ pub.venue | jsonify }} },
      "identifier": { "@type": "PropertyValue", "propertyID": "DOI", "value": {{ pub.doi | jsonify }} },
      "url": {{ 'https://doi.org/' | append: pub.doi | jsonify }},
      "description": {{ pub.summary | jsonify }}
    }{% unless forloop.last %},{% endunless %}
  {%- endfor %}
  ]
}
</script>
