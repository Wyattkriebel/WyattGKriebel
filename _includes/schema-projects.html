<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@graph": [
  {%- for pr in site.data.projects %}
    {
      "@type": "SoftwareSourceCode",
      "name": {{ pr.name | jsonify }},
      "description": {{ pr.summary | jsonify }},
      "codeRepository": {{ pr.repo | jsonify }},
      {%- if pr.play %}
      "url": {{ pr.play | absolute_url | jsonify }},
      {%- endif %}
      "author": { "@type": "Person", "name": {{ site.data.profile.name | jsonify }}, "url": {{ site.url | append: '/' | jsonify }} }
    }{% unless forloop.last %},{% endunless %}
  {%- endfor %}
  ]
}
</script>
